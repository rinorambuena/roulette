<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruleta del Equipo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Ruleta</h2>

    <div class="controls">
      <button class="primary" id="spin-btn" onclick="spin()">Girar</button>
      <button class="secondary" onclick="resetWheel()">Reiniciar</button>
    </div>

    <div id="mode-selector">
      <label class="mode-option">
        <input type="radio" name="mode" value="simple" checked>
        <span class="mode-label">Simple</span>
        <span class="mode-desc">El seleccionado gana</span>
      </label>
      <label class="mode-option">
        <input type="radio" name="mode" value="elimination">
        <span class="mode-label">Eliminación</span>
        <span class="mode-desc">Se eliminan uno a uno hasta el último</span>
      </label>
    </div>

    <details class="bulk-input">
      <summary>Carga rápida de nombres</summary>
      <div class="bulk-row">
        <input type="text" id="bulk-names" placeholder="Relampago;Tornado;Veloz;Furia" />
        <button onclick="bulkLoad(document.getElementById('bulk-names').value)">Cargar</button>
      </div>
    </details>

    <div class="config-panel">
      <h3>Participantes</h3>
      <div id="config-panel"></div>
      <button class="add-btn" onclick="addSlot()">+ Agregar</button>
    </div>

    <div class="wheel-wrap">
      <div class="pointer">▼</div>
      <canvas id="wheel" width="420" height="420"></canvas>
    </div>

    <div class="status-bar">
      <span class="status-msg" id="status-msg">Configura y presiona Girar para arrancar la ruleta.</span>
    </div>

    <div id="result-banner" class="result-banner" style="display:none"></div>

    <script src="js/config.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
